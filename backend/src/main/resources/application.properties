spring.application.name=FleetTelematicsBackend

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/fleet_telematics
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info

# Security settings. JWT_SECRET must be a Base64-encoded random key of at least 32 bytes.
app.security.jwt.secret-base64=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:fleet-telematics}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.security.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
